<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Downloader</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --card: #1a1a24;
    --border: #2a2a3d;
    --accent: #6c63ff;
    --accent2: #ff6584;
    --text: #e8e8f0;
    --muted: #6b6b80;
    --success: #2dce89;
    --error: #f5365c;
    --info: #11cdef;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'IBM Plex Sans Arabic', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    overflow-x: hidden;
  }

  /* Animated background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 20% 30%, rgba(108,99,255,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 50% 40% at 80% 70%, rgba(255,101,132,0.08) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .card {
    position: relative;
    z-index: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px;
    width: 100%;
    max-width: 520px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(108,99,255,0.1);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 6px;
  }

  .logo-icon {
    width: 44px;
    height: 44px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  h1 {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.5px;
  }

  .subtitle {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 28px;
    padding-right: 56px;
  }

  /* Supported platforms */
  .platforms {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }

  .platform-tag {
    background: rgba(108,99,255,0.1);
    border: 1px solid rgba(108,99,255,0.2);
    color: var(--accent);
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 20px;
    font-weight: 600;
  }

  /* Input */
  .input-wrap {
    position: relative;
    margin-bottom: 14px;
  }

  .input-wrap input {
    width: 100%;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 14px 48px 14px 16px;
    font-size: 14px;
    color: var(--text);
    font-family: inherit;
    direction: ltr;
    transition: border-color 0.2s;
    outline: none;
  }

  .input-wrap input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(108,99,255,0.15);
  }

  .input-wrap input::placeholder { color: var(--muted); }

  .paste-btn {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(108,99,255,0.15);
    border: none;
    color: var(--accent);
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.2s;
  }
  .paste-btn:hover { background: rgba(108,99,255,0.3); }

  /* Download button */
  .btn-dl {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--accent) 0%, #8b5cf6 100%);
    border: none;
    border-radius: 12px;
    color: white;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    position: relative;
    overflow: hidden;
  }

  .btn-dl:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
  .btn-dl:active:not(:disabled) { transform: translateY(0); }
  .btn-dl:disabled { opacity: 0.5; cursor: not-allowed; }

  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Result area */
  .result {
    margin-top: 20px;
    border-radius: 12px;
    overflow: hidden;
    display: none;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .result.error { background: rgba(245,54,92,0.1); border: 1px solid rgba(245,54,92,0.2); padding: 14px 16px; color: var(--error); font-size: 14px; }
  .result.info { background: rgba(17,205,239,0.08); border: 1px solid rgba(17,205,239,0.15); padding: 14px 16px; color: var(--info); font-size: 14px; }
  .result.success { background: var(--surface); border: 1px solid var(--border); }

  .meta { padding: 16px; border-bottom: 1px solid var(--border); }
  .meta-title { font-weight: 600; font-size: 14px; margin-bottom: 4px; color: var(--text); }
  .meta-desc { color: var(--muted); font-size: 12px; line-height: 1.5; }

  .dl-btns { padding: 14px; display: flex; gap: 10px; flex-wrap: wrap; }

  .dl-btn {
    flex: 1;
    min-width: 120px;
    padding: 11px 16px;
    border: none;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .dl-btn.video { background: linear-gradient(135deg, var(--success), #1aab6d); color: white; }
  .dl-btn.audio { background: rgba(108,99,255,0.15); border: 1px solid rgba(108,99,255,0.3); color: var(--accent); }
  .dl-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
  .dl-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  .progress-wrap {
    margin: 10px 14px 14px;
    background: var(--border);
    border-radius: 99px;
    height: 6px;
    overflow: hidden;
    display: none;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--success));
    border-radius: 99px;
    width: 0%;
    transition: width 0.3s ease;
  }
  .dl-status {
    padding: 0 14px 12px;
    font-size: 12px;
    color: var(--muted);
    display: none;
  }

  /* Notice */
  .notice {
    margin-top: 20px;
    background: rgba(255,101,132,0.08);
    border: 1px solid rgba(255,101,132,0.15);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.6;
  }
  .notice strong { color: var(--accent2); }

  /* Footer */
  .footer {
    position: relative;
    z-index: 1;
    margin-top: 20px;
    color: var(--muted);
    font-size: 12px;
    text-align: center;
  }
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <div class="logo-icon">⬇️</div>
    <h1>Video Downloader</h1>
  </div>
  <p class="subtitle">حمّل فيديوهاتك من مواقع التواصل الاجتماعي</p>

  <div class="platforms">
    <span class="platform-tag">TikTok</span>
    <span class="platform-tag">Instagram</span>
    <span class="platform-tag">YouTube</span>
    <span class="platform-tag">Facebook</span>
    <span class="platform-tag">Snapchat</span>
    <span class="platform-tag">وأكثر...</span>
  </div>

  <div class="input-wrap">
    <input type="url" id="urlInput" placeholder="https://www.tiktok.com/@user/video/..." autocomplete="off">
    <button class="paste-btn" onclick="pasteUrl()">📋 لصق</button>
  </div>

  <button class="btn-dl" id="dlBtn" onclick="startDownload()">⬇️ تحميل الفيديو</button>

  <div id="result" class="result"></div>

  <div class="notice">
    <strong>⚠️ ملاحظة:</strong> تويتر/X غير مدعوم. للمحتوى الخاص، تأكد أن الحساب عام.
  </div>
</div>

<div class="footer">
  يستخدم هذا الموقع خدمة sii3.top للتحميل · للاستخدام الشخصي فقط
</div>

<script>
  // ✅ الحل الكامل: استدعاء API مباشرة بدون server.py
  // نستخدم cors-anywhere أو نطلب مباشرة إذا API تدعم CORS
  const API = 'https://sii3.top/api/download.php';

  // CORS Proxy كخيار احتياطي
  const CORS_PROXY = 'https://corsproxy.io/?';

  async function pasteUrl() {
    try {
      const text = await navigator.clipboard.readText();
      document.getElementById('urlInput').value = text;
    } catch {
      document.getElementById('urlInput').focus();
    }
  }

  async function startDownload() {
    const url = document.getElementById('urlInput').value.trim();
    const btn = document.getElementById('dlBtn');

    if (!url) {
      showResult('الرجاء إدخال رابط الفيديو.', 'error');
      return;
    }

    if (url.includes('twitter.com') || url.includes('x.com')) {
      showResult('عذراً، تويتر/X غير مدعوم حالياً.', 'error');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> جاري التحميل...';
    showResult('⏳ جاري معالجة الرابط...', 'info');

    try {
      let data = null;

      // المحاولة الأولى: API مباشرة
      try {
        const res = await fetch(`${API}?url=${encodeURIComponent(url)}`, {
          signal: AbortSignal.timeout(20000)
        });
        if (res.ok) {
          const text = await res.text();
          data = JSON.parse(text);
        }
      } catch (e) {
        // إذا فشل (CORS) نجرب الـ proxy
        console.log('Direct API failed, trying proxy...', e.message);
      }

      // المحاولة الثانية: عبر CORS proxy
      if (!data) {
        const proxyUrl = CORS_PROXY + encodeURIComponent(`${API}?url=${encodeURIComponent(url)}`);
        const res2 = await fetch(proxyUrl, {
          signal: AbortSignal.timeout(25000)
        });
        if (!res2.ok) throw new Error('فشل الاتصال بخدمة التحميل.');
        const text2 = await res2.text();
        data = JSON.parse(text2);
      }

      // استخراج الروابط
      let video = null, audio = null;

      if (data.links && Array.isArray(data.links)) {
        for (const link of data.links) {
          const type = (link.type || '').toLowerCase();
          const u = link.url || link.link;
          if (type === 'video' && !video) video = u;
          if (type === 'audio' && !audio) audio = u;
        }
      }
      if (!video && data.video) video = data.video;
      if (!audio && data.audio) audio = data.audio;

      if (!video && !audio) throw new Error('لا توجد وسائط قابلة للتحميل.');

      // عرض النتيجة
      const resultEl = document.getElementById('result');
      resultEl.innerHTML =
        (data.title || data.description
          ? `<div class="meta">${data.title ? `<div class="meta-title">📹 ${esc(data.title)}</div>` : ''}${data.description ? `<div class="meta-desc">${esc(data.description.substring(0,120))}${data.description.length>120?'..':''}</div>` : ''}</div>`
          : '')
        + `<div class="dl-btns">`
        + (video ? `<button id="btnVideo" class="dl-btn video" onclick="doDownload(${JSON.stringify(video)},'video','btnVideo')">📹 تحميل الفيديو</button>` : '')
        + (audio ? `<button id="btnAudio" class="dl-btn audio" onclick="doDownload(${JSON.stringify(audio)},'audio','btnAudio')">🎵 تحميل الصوت</button>` : '')
        + `</div>`
        + `<div class="progress-wrap" id="progressWrap"><div class="progress-bar" id="progressBar"></div></div>`
        + `<div class="dl-status" id="dlStatus"></div>`;
      resultEl.className = 'result success';
      resultEl.style.display = 'block';

    } catch (err) {
      const msg = err.name === 'TimeoutError' ? 'انتهت مهلة الاتصال، حاول مجدداً.' : (err.message || 'حدث خطأ غير متوقع.');
      showResult('❌ ' + msg, 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '⬇️ تحميل الفيديو';
    }
  }

  async function doDownload(url, type, btnId) {
    const btn = document.getElementById(btnId);
    const progressWrap = document.getElementById('progressWrap');
    const progressBar = document.getElementById('progressBar');
    const dlStatus = document.getElementById('dlStatus');
    const ext = type === 'audio' ? 'mp3' : 'mp4';
    const filename = `${type}_${Date.now()}.${ext}`;

    // أولاً: جرب تحميل مباشر عبر <a download>
    // هذا يشتغل لو السيرفر يرسل header مناسب
    btn.disabled = true;
    const origText = btn.innerHTML;
    btn.innerHTML = type === 'video' ? '⏳ جاري التحميل...' : '⏳ جاري التحميل...';

    progressWrap.style.display = 'block';
    progressBar.style.width = '10%';
    dlStatus.style.display = 'block';
    dlStatus.textContent = 'جاري جلب الملف...';

    // الطريقة ١: fetch → blob (يحل مشكلة "فتح في تاب" بدل التحميل)
    try {
      // نجرب عبر CORS proxy لأن روابط CDN الخارجية تمنع direct fetch
      const proxyFetch = 'https://corsproxy.io/?' + encodeURIComponent(url);
      
      const response = await fetch(proxyFetch, { signal: AbortSignal.timeout(60000) });
      
      if (!response.ok) throw new Error('fetch failed');

      // قراءة مع progress
      const contentLength = response.headers.get('Content-Length');
      const total = contentLength ? parseInt(contentLength) : 0;
      let loaded = 0;
      const reader = response.body.getReader();
      const chunks = [];

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        loaded += value.length;
        if (total > 0) {
          const pct = Math.round((loaded / total) * 100);
          progressBar.style.width = pct + '%';
          dlStatus.textContent = `تحميل ${pct}% (${(loaded/1024/1024).toFixed(1)} MB)`;
        } else {
          // لا نعرف الحجم، نحرك شريط وهمي
          progressBar.style.width = Math.min(90, (loaded/1024/1024) * 5 + 20) + '%';
          dlStatus.textContent = `تحميل... (${(loaded/1024/1024).toFixed(1)} MB)`;
        }
      }

      const blob = new Blob(chunks);
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(blobUrl), 5000);

      progressBar.style.width = '100%';
      dlStatus.textContent = '✅ تم التحميل بنجاح!';
      setTimeout(() => {
        progressWrap.style.display = 'none';
        dlStatus.style.display = 'none';
      }, 3000);

    } catch (err) {
      // الطريقة ٢: فتح الرابط مباشرة في تاب جديد كـ fallback
      console.warn('Blob download failed, opening directly:', err.message);
      progressBar.style.width = '100%';
      dlStatus.textContent = '⚠️ جاري فتح الفيديو... احفظه يدوياً (كليك يمين ← حفظ)';
      
      // نحاول نفتح رابط مباشر مع download attribute
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.target = '_blank';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    btn.disabled = false;
    btn.innerHTML = origText;
  }

  function showResult(msg, type) {
    const el = document.getElementById('result');
    el.textContent = msg;
    el.className = 'result ' + type;
    el.style.display = 'block';
  }

  function esc(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
